name: Update contribution visuals

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/snake.yml
      - scripts/generate-activity.mjs
      - scripts/generate-stats.mjs

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate contribution activity graphs
        id: activity
        continue-on-error: true
        run: node scripts/generate-activity.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain previous graph if GitHub is temporarily unavailable
        if: steps.activity.outcome == 'failure'
        run: echo '::warning::Activity graph refresh failed. Existing graph assets will be retained.'
      - name: Generate GitHub stats and language cards
        id: stats
        continue-on-error: true
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain previous stats if GitHub is temporarily unavailable
        if: steps.stats.outcome == 'failure'
        run: echo '::warning::Stats refresh failed. Existing stats assets will be retained.'
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#7c3aed&color_dots=#e2e8f0,#c4b5fd,#a78bfa,#7c3aed,#087e96
            assets/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#1e293b,#4c1d95,#7c3aed,#a78bfa,#22d3ee
      - name: Save updated animations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/snake-light.svg assets/snake-dark.svg
          if [ -f assets/activity-light.svg ] && [ -f assets/activity-dark.svg ]; then
            git add assets/activity-light.svg assets/activity-dark.svg
          fi
          if [ -f assets/stats-light.svg ] && [ -f assets/stats-dark.svg ]; then
            git add assets/stats-light.svg assets/stats-dark.svg
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution visuals'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
